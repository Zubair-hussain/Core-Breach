name: Release

# Push a tag like v1.0.0 and this builds a zip of the game and publishes a GitHub release.

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run ci
      - name: Build the downloadable zip
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p dist
          cp -r public "dist/core-breach-$VERSION"
          cp LICENSE README.md "dist/core-breach-$VERSION/"
          (cd dist && zip -qr "core-breach-$VERSION.zip" "core-breach-$VERSION")
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "dist/core-breach-${GITHUB_REF_NAME#v}.zip" \
            --title "Core Breach $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
