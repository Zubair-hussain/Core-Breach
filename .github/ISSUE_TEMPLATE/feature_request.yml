name: Feature request
description: Suggest a new weapon, enemy, mode or improvement
labels: [enhancement]
body:
  - type: textarea
    id: idea
    attributes:
      label: What would you like to see?
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why would it make the game better?
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Weapons, Enemies, Maps, Controls, Audio, HUD and menus, Performance, Other]
    validations:
      required: true
